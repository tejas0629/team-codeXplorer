<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xplorer UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <headers class="navbar">
        <div id="container">
          <nav class="nav-links" id="navLinks">
            <a id="h" href="#"><b>Home</b></a>
            <a id="f" href="#"><b>Features</b></a>
            <a id="d" href="#"><b>Docs</b></a>
            <a id="c" href="#"><b>Contact</b></a>
          </nav>
        </div>
    </headers>
    <header>
    <h1>Xplorer UI
        <div id="boxt" class="toggle-switch" onclick="toggleDarkMode()">
            <div class="slider" id="slider-icon">🌞</div>
          </div></h1> 
  </header>
  <main>
    <section class="row">
        <div class="col-12">
            <h2>All Xplorer UI (Desktop View)</h2>
        </div>
        <div class="col-1"><div id="b1" class="box">1</div></div>
        <div class="col-1"><div id="b2" class="box">2</div></div>
        <div class="col-1"><div id="b3" class="box">3</div></div>
        <div class="col-1"><div id="b4" class="box">4</div></div>
        <div class="col-1"><div id="b5" class="box">5</div></div>
        <div class="col-1"><div id="b6" class="box">6</div></div>
        <div class="col-1"><div id="b7" class="box">7</div></div>
        <div class="col-1"><div id="b8" class="box">8</div></div>
        <div class="col-1"><div id="b9" class="box">9</div></div>
        <div class="col-1"><div id="b10" class="box">10</div></div>
        <div class="col-1"><div id="b11" class="box">11</div></div>
        <div class="col-1"><div id="b12" class="box">12</div></div>
    </section>
    <section class="row">
        <div class="col-12">
            <h2>Column Combinations</h2>
            <p>Try resizing your browser to see responsive behavior</p>
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-3"><div id="b5" class="box">Box 1</div></div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-3"><div id="b3" class="box">Box 2</div></div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-3"><div id="b1" class="box">Box 3</div></div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-3"><div id="b12" class="box">Box 4</div></div>
    </section>
</main>
  <script src="script.js"></script>
  <footer>
    <p> CodeXplorers | Responsive Grid System </p>
  </footer>
</body>
</html>
